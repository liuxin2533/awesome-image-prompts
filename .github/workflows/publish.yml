name: Publish Prompt Catalog

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read upstream files from the network or local fixtures.
        required: true
        default: remote
        type: choice
        options:
          - remote
          - local
      sources:
        description: Optional comma-separated source keys.
        required: false
        default: ""
        type: string
      target_languages:
        description: Canonical dataset languages.
        required: true
        default: en,zh-CN
        type: string
      catalog_languages:
        description: Public catalog export languages.
        required: true
        default: en,zh-CN
        type: string
      translate:
        description: Fill missing translations with the configured AI provider.
        required: true
        default: false
        type: boolean
      translation_languages:
        description: Languages to translate when translation is enabled.
        required: false
        default: zh-CN
        type: string
      mirror_assets:
        description: Download missing preview assets into public/assets.
        required: true
        default: false
        type: boolean
      strict:
        description: Fail when enabled optional steps report failures.
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: write

concurrency:
  group: publish-prompt-catalog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MODE: ${{ github.event.inputs.mode || 'remote' }}
      SOURCES: ${{ github.event.inputs.sources || '' }}
      TARGET_LANGUAGES: ${{ github.event.inputs.target_languages || 'en,zh-CN' }}
      CATALOG_LANGUAGES: ${{ github.event.inputs.catalog_languages || 'en,zh-CN' }}
      TRANSLATE: ${{ github.event.inputs.translate || 'false' }}
      TRANSLATION_LANGUAGES: ${{ github.event.inputs.translation_languages || 'zh-CN' }}
      MIRROR_ASSETS: ${{ github.event.inputs.mirror_assets || 'false' }}
      STRICT: ${{ github.event.inputs.strict || 'true' }}
      ZHIPUAI_API_KEY: ${{ secrets.ZHIPUAI_API_KEY }}
      ZHIPUAI_BASE_URL: ${{ secrets.ZHIPUAI_BASE_URL }}
      ZHIPUAI_MODEL: ${{ secrets.ZHIPUAI_MODEL }}
      AI_TRANSLATION_API_KEY: ${{ secrets.AI_TRANSLATION_API_KEY }}
      AI_TRANSLATION_BASE_URL: ${{ secrets.AI_TRANSLATION_BASE_URL }}
      AI_TRANSLATION_MODEL: ${{ secrets.AI_TRANSLATION_MODEL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Ingest and export
        shell: bash
        run: |
          set -euo pipefail

          args=(--mode "$MODE" --target-languages "$TARGET_LANGUAGES" --catalog-languages "$CATALOG_LANGUAGES")

          if [ -n "$SOURCES" ]; then
            args+=(--sources "$SOURCES")
          fi

          if [ "$TRANSLATE" = "true" ]; then
            args+=(--translate --translation-languages "$TRANSLATION_LANGUAGES")
          fi

          if [ "$MIRROR_ASSETS" = "true" ]; then
            args+=(--mirror-assets)
          fi

          if [ "$STRICT" = "true" ]; then
            args+=(--strict)
          fi

          pnpm workflow "${args[@]}"

      - name: Upload ingestion report
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-report
          path: |
            data/reports/latest.json
            data/reports/latest.md
            data/catalog/manifest.json

      - name: Commit generated catalog
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain)" ]; then
            echo "No generated changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs README.md README_zh-CN.md
          if [ -d public ]; then
            git add public
          fi
          git commit -m "chore: publish prompt catalog"
          git push
