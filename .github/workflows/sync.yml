name: Sync Image Prompts

on:
  # 每天凌晨 2:00 执行
  schedule:
    - cron: '0 2 * * *'

  # 支持手动触发
  workflow_dispatch:

  # 当推送到 main 分支时也可以触发
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/sync.yml'

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run sync workflow (Remote Mode)
        run: pnpm run workflow
        env:
          USE_REMOTE: 'true'

      - name: Check changes
        id: changed
        run: |
          if git diff --stat | grep -q .; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create commit and PR
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # 创建提交
          git add .
          git commit -m "chore: sync upstream data $(date +'%Y-%m-%d %H:%M')

          Co-Authored-By: GitHub Actions <noreply@github.com>"

      - name: Push changes
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          git push origin main

  # 可选：翻译分类（需要配置 DEEPSEEK_API_KEY）
  translate:
    runs-on: ubuntu-latest
    needs: sync
    if: github.event_name == 'workflow_dispatch' && vars.DEEPSEEK_API_KEY != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Translate categories
        run: pnpm run translate:categories
        env:
          DEEPSEEK_API_KEY: ${{ vars.DEEPSEEK_API_KEY }}
          USE_REMOTE: 'true'