<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>提示词目录工作台</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">本地维护工具</p>
          <h1>提示词目录工作台</h1>
        </div>
        <button id="refresh" type="button">刷新报告</button>
      </header>

      <section class="metrics" aria-label="报告摘要">
        <div class="metric error"><span>Errors</span><strong id="metric-errors">0</strong></div>
        <div class="metric warning"><span>Warnings</span><strong id="metric-warnings">0</strong></div>
        <div class="metric info"><span>Info</span><strong id="metric-info">0</strong></div>
        <div class="metric"><span>生成时间</span><strong id="metric-generated">-</strong></div>
        <div class="metric"><span>新增</span><strong id="metric-added">0</strong></div>
        <div class="metric"><span>更新</span><strong id="metric-updated">0</strong></div>
        <div class="metric"><span>无变化</span><strong id="metric-unchanged">0</strong></div>
      </section>

      <section class="workspace">
        <aside class="panel controls">
          <h2>筛选问题</h2>
          <label>
            搜索
            <input id="filter-text" type="search" placeholder="prompt、字段、消息">
          </label>
          <label>
            Severity
            <select id="filter-severity"></select>
          </label>
          <label>
            Code
            <select id="filter-code"></select>
          </label>
          <label>
            处理类型
            <select id="filter-resolution"></select>
          </label>

          <h2>发布输出</h2>
          <button data-action="catalog-export" type="button">导出全语言 catalog</button>
          <button data-action="readme-generate" type="button">生成全语言 README</button>
          <button data-action="workflow" type="button">重跑发布流程</button>

          <h2>智谱 AI 配置</h2>
          <label>
            API Key
            <input id="ai-key" type="password" autocomplete="off" placeholder="ZHIPUAI_API_KEY">
          </label>
          <label>
            接口地址
            <input id="ai-base-url" type="url">
          </label>
          <label>
            模型
            <input id="ai-model" type="text">
          </label>
          <div class="button-row">
            <button id="save-config" type="button">保存配置</button>
            <button id="test-config" type="button">测试连接</button>
          </div>
          <p id="config-status" class="muted">正在读取配置...</p>
        </aside>

        <section class="panel issue-panel">
          <div class="panel-head">
            <h2>问题列表</h2>
            <span id="issue-count" class="muted">显示 0 条</span>
          </div>
          <div class="issue-table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Severity</th>
                  <th>Code</th>
                  <th>Prompt</th>
                  <th>字段</th>
                  <th>说明</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="issues"></tbody>
            </table>
          </div>
        </section>

        <aside class="panel actions">
          <h2>批量操作</h2>
          <label>
            限制数量
            <input id="action-limit" type="number" min="1" step="1" placeholder="可选">
          </label>
          <h2>打包翻译</h2>
          <label>
            目标语言
            <select id="batch-translation-language"></select>
          </label>
          <label>
            每批条数
            <input id="batch-size" type="number" min="1" step="1" value="20">
          </label>
          <button data-action="translate" data-batch="translation" type="button">打包补齐所选语言</button>

          <h2>快捷操作</h2>
          <div class="quick-actions">
            <button data-action="translate" data-language="zh-CN" type="button">补齐 zh-CN 翻译</button>
            <button data-action="translate" data-language="en" type="button">补齐 en 翻译</button>
            <button data-action="mirror-assets" type="button">镜像缺失资源</button>
            <button data-action="classify" type="button">重新归类</button>
            <button data-action="refresh-report" type="button">刷新当前报告</button>
          </div>

          <h2>人工归类</h2>
          <label>
            标准分类
            <select id="classification-category"></select>
          </label>

          <h2>操作说明</h2>
          <p class="muted">批量按钮会按当前队列执行白名单命令；单条按钮只修正该行对应的 prompt 字段、资源或分类。发布输出只读取当前标准数据或当前 catalog，不会重新抓取上游。</p>

          <h2>问题详情</h2>
          <button id="fix-selected" type="button" disabled>修正所选问题</button>
          <pre id="issue-detail">请选择一条问题。</pre>

          <h2>运行日志</h2>
          <pre id="run-log">本次会话还没有执行操作。</pre>
        </aside>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
